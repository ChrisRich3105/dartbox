# /etc/dartbox/dartbox.conf  -  shell-style KEY=VALUE, read by all dartbox services

# --- Hotspot (setup mode) -------------------------------------------------
# SSID gets the last 4 hex digits of the WiFi MAC appended, e.g. "Dartbox-3fa1"
HOTSPOT_SSID_PREFIX=Dartbox
# WPA2 password for the setup hotspot (min. 8 chars). Empty = open network.
HOTSPOT_PASSWORD=dartsetup
HOTSPOT_ADDRESS=10.42.0.1

# Seconds without any network connection before the hotspot is started
CONNECT_GRACE=90
# While in hotspot mode with no client connected, retry known WiFi every N seconds
RETRY_INTERVAL=300
# How long a retry may take before going back to hotspot
RETRY_TIMEOUT=45

# --- Hub / kiosk (display mode) -------------------------------------------
# Pages the hub (http://dartbox.local/) links to and can show on the screen.
AUTODARTS_URL=https://play.autodarts.io
# Autodarts board manager (local)
BOARD_MANAGER_URL=http://localhost:3180
# Local playroom (offline games + training, dartbox-playroom service). Empty = hidden.
PLAYROOM_URL=http://localhost:8081/
# What the screen opens after boot once online: autodarts | board | playroom | hub
KIOSK_START=autodarts

# --- Language and caller ---------------------------------------------------
# Language of hub and playroom: auto (browser language), de, en. Each device can override it
# in the playroom settings.
LANGUAGE=auto
# Natural caller voices (Piper TTS, downloaded by the installer to /var/lib/dartbox/voices).
# CALLER_VOICE_xx is the default voice per language; every device can pick another installed
# voice in Playroom -> Settings -> Caller. Any voice from https://huggingface.co/rhasspy/piper-voices
# works. Empty = use the device's own (browser) voice.
CALLER_VOICE_DE=de_DE-thorsten_emotional-medium
CALLER_VOICE_EN=en_GB-alan-medium
# More voices to choose from (space separated, ~20-110 MB each), downloaded by the next
# installer run / update. Some good ones:
#   German:  de_DE-thorsten-high  de_DE-kerstin-low  de_DE-eva_k-x_low  de_DE-karlsson-low
#   English: en_US-ryan-high  en_US-lessac-high  en_GB-alba-medium  en_US-joe-medium
CALLER_VOICES_EXTRA=

# --- Power button ---------------------------------------------------------
# 1 press  -> shutdown,   3 presses -> hotspot/setup mode,   5 presses -> forget all WiFi
POWER_BUTTON_ENABLED=1
