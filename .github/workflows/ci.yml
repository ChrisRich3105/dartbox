name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # reused by the release workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Static checks (Python, shell, JSON, VERSION)
        run: bash tests/check-scripts.sh
      - name: Game engine tests
        run: node tests/run-engine-tests.mjs
